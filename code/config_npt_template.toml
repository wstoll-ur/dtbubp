# dtbubp fixed-temperature NPT tests (CP2K-MACE) of the r0 potential, compared with experiment.
# Copy into Calculations/04_npt_ramp_78-300K/fixedT_r0/config.toml. Relative paths are relative to that folder.

[paths]
code_dir   = "../../../code"
frames     = "../../02_dft_dataset/frame_selection/frames.extxyz"            # start structures (fix-deform frames)
model_cp2k = "../../03_mace_finetune/models/potential_r0/dtbubp_pot_r0_stagetwo.model-cp2k.pth"
labels     = "../../02_dft_dataset/parsed/labels.xyz"                       # DFT labels (npt-diagnose)
dft_config = "../../02_dft_dataset/config.toml"                              # DFT settings + CPU Slurm/env (eos-dft)
run_dir    = "."                                                              # T298/, T260/, ... are created here

[npt]
temperatures         = [298, 260, 220, 180, 120, 80]   # K. Add 215 / 160 / 150 to match the XRD structures; `npt-setup` only submits new ones
supercell            = [2, 2, 2]     # 736 atoms, 16 molecules (the 92-atom cell is smaller than 2x the MACE receptive field)
ensemble             = "NPT_F"       # fully flexible cell, to compare a, b, c and angles; "NPT_I" = isotropic
time_ps              = 100.0
discard_ps           = 20.0          # equilibration, not averaged
timestep_fs          = 0.5
thermostat_timecon_fs = 100.0        # CSVR
barostat_timecon_fs  = 1000.0        # as Will's npt_mace.inp and the 9MA tests
pressure_bar         = 1.0
print_every          = 20            # cell / energy / stress every 10 fs
traj_every           = 400           # positions every 200 fs (for rotor/twist analysis)
restart_every        = 10000         # restart file every 5 ps (a job killed at the time limit continues from it)
v_watchdog           = [0.80, 1.25]  # x starting volume: outside -> the run is stopped (blow-up / collapse)
time_limit           = "24:00:00"

[eos]
# eos-scan: rigid-molecule volume scan of the 298 K frame, atoms relaxed at fixed cell with MACE r0 at each volume
v_per_molecule = [350.0, 365.0, 380.0, 395.0, 410.0, 430.0, 450.0, 470.0]
fmax           = 0.01     # eV/A
max_steps      = 500

[experiment]
# Volume per molecule on cooling, read off volume_vs_temperature_ONCOOLING.png (approximate), ascending T.
# These are already per molecule (V_cell / Z of the phase present): they agree with the SC-XRD points below.
T_K               = [80, 90, 100, 120, 140, 150, 160, 170, 180, 190, 200, 205, 210, 215, 220, 240, 260, 280, 298]
V_per_molecule_A3 = [400.9, 402.8, 404.4, 405.5, 407.2, 408.0, 412.7, 413.7, 414.7, 416.1, 416.9, 417.8, 418.1, 419.7, 420.2, 422.6, 425.1, 427.7, 430.0]
cell_298          = [8.2340, 10.1638, 11.8166, 66.646, 83.975, 71.361]   # 298k.cif, P-1, Z = 2

# Phases (all P-1). Boundaries are approximate: Z = 2 at 215 K (heating) and 298 K; Z = 12 at 160 and 180 K;
# Z = 10 at 150 K; cooling curve: kink at ~210-215 K, step between 150 and 160 K. Hysteresis not resolved.
[[experiment.phases]]
name = "III"
Z = 10
space_group = "P-1"
T_max = 155.0
[[experiment.phases]]
name = "II"
Z = 12
space_group = "P-1"
T_min = 155.0
T_max = 212.0
[[experiment.phases]]
name = "I"
Z = 2
space_group = "P-1"
T_min = 212.0

# Single-crystal structures in DtBuDp/Structures (and the 160 K cell from the OPLS inputs). cell = a b c alpha beta gamma.
[[experiment.xrd]]
T = 298.0
phase = "I"
Z = 2
V_cell = 860.01
cell = [8.2340, 10.1638, 11.8166, 66.646, 83.975, 71.361]
source = "298k.cif (was Data/crystal_structures/)"
[[experiment.xrd]]
T = 215.0
phase = "I"
Z = 2
V_cell = 839.54
cell = [8.2368, 10.0409, 11.7105, 67.039, 83.756, 70.345]
source = "Structures/215_heating/5_215.cif (heating)"
[[experiment.xrd]]
T = 180.0
phase = "II"
Z = 12
V_cell = 4977.33
cell = [8.1439, 23.1803, 26.5087, 92.011, 91.075, 95.452]
source = "Structures/180/1_180.cif"
[[experiment.xrd]]
T = 160.0
phase = "II"
Z = 12
V_cell = 4952.06
cell = [8.1301, 23.1269, 26.4805, 92.164, 91.157, 95.384]
source = "160k.cif (values from legacy validate_160.in; CIF not in folder)"
[[experiment.xrd]]
T = 150.0
phase = "III"
Z = 10
V_cell = 4079.79
cell = [7.1465, 23.4247, 25.7589, 108.558, 93.185, 90.609]
source = "Structures/150/4_150.cif"

[env]
# = 9MA/cp2k/9MA_mace_cp2k_test/env_cp2k_mace.sh (Will's CP2K master + MACE build). The binary is linked
# against PLUMED 2.10.0 (rebuilt 2026-10-04), so libplumed.so must be on LD_LIBRARY_PATH even without biasing.
cp2k_mace = """
module purge
module load profile/base
module load openmpi/4.1.6--gcc--12.2.0
module load cuda/12.6
module load python/3.11.7
source $HOME/cp2k_torch_env/bin/activate
source $HOME/software/cp2k-2026.2/tools/toolchain/install/setup
source $HOME/cp2k_torch_env/bin/activate
export TORCH_LIB=$(python -c 'import torch, os; print(os.path.join(os.path.dirname(torch.__file__), "lib"))')
export LD_LIBRARY_PATH=$HOME/software/cp2k-mace/install/lib64:${LD_LIBRARY_PATH}
export LD_LIBRARY_PATH=$HOME/software/libxc-7.1.2/install/lib64:${LD_LIBRARY_PATH}
export LD_LIBRARY_PATH=${TORCH_LIB}:${LD_LIBRARY_PATH}
export LD_LIBRARY_PATH=$HOME/software/plumed-2.10.0/install/lib:${LD_LIBRARY_PATH}
export OMP_NUM_THREADS=${SLURM_CPUS_PER_TASK:-8}
export OMP_PLACES=cores
export OMP_PROC_BIND=spread
export PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
export CP2K=$HOME/software/cp2k-mace/install/bin/cp2k.psmp
"""

[slurm.gpu]
account   = "IscrB_MET2SAF"
partition = "boost_usr_prod"
qos       = "normal"
extra     = ["--nodes=1", "--ntasks=1", "--cpus-per-task=8", "--gres=gpu:1"]
